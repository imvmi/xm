name: ci

on:
  push:
    branches: ["**"]
    tags: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish (for example v1.0.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: go test ./...
      - run: go vet ./...
      - run: node --test internal/web/testdata/*.test.cjs

  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - name: Record source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build and package
        env:
          RELEASE_OS: ${{ matrix.goos }}
          RELEASE_ARCH: ${{ matrix.goarch }}
        run: bash .github/scripts/package-release.sh "$RELEASE_OS" "$RELEASE_ARCH"
      - uses: actions/upload-artifact@v4
        with:
          name: xm-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/releases/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: publish release
    needs: [test, build]
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: xm-*
          merge-multiple: true
          path: release
      - name: Verify packages and generate checksums
        working-directory: release
        run: |
          set -euo pipefail
          packages=(xm-windows-amd64.zip xm-darwin-amd64.tar.gz xm-darwin-arm64.tar.gz xm-linux-amd64.tar.gz xm-linux-arm64.tar.gz)
          for package in "${packages[@]}"; do test -s "$package"; done
          sha256sum "${packages[@]}" > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Publish complete release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_SHA: ${{ needs.build.outputs.sha }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          title="XM ${tag}"
          cat > release-notes.md <<EOF_NOTES
          由标签 ${tag} 自动构建。提交：${RELEASE_SHA}

          - Windows x64：xm-windows-amd64.zip
          - macOS Intel：xm-darwin-amd64.tar.gz
          - macOS Apple Silicon：xm-darwin-arm64.tar.gz
          - Linux x64：xm-linux-amd64.tar.gz
          - Linux ARM64：xm-linux-arm64.tar.gz

          解压后运行 ./xm serve（Windows 使用 .\xm.exe serve），打开 [http://127.0.0.1:8080](http://127.0.0.1:8080)。
          运行仍需 Chrome / Chromium 或可连接的 CDP 浏览器。macOS 版本未签名或公证。
          校验文件：SHA256SUMS。升级前请停止旧服务并备份配置、数据库和媒体。
          EOF_NOTES

          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null); then
            echo "Release $tag already exists; uploading build assets and preserving its title and notes."
          else
            gh release create "$tag" --verify-tag --title "$title" --notes-file release-notes.md --draft
            draft=true
          fi
          gh release upload "$tag" xm-*.zip xm-*.tar.gz SHA256SUMS --clobber
          if [[ "$draft" == true ]]; then
            gh release edit "$tag" --draft=false
          fi
