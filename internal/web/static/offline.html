<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <title>暂时无法连接 · XM</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/offline.css">
  <script defer src="/assets/offline.js"></script>
</head>
<body>
  <main>
    <img src="/assets/icon-192.png" alt="XM" width="72" height="72">
    <p class="eyebrow">私人动态档案</p>
    <h1>暂时无法连接</h1>
    <p>请检查网络连接，并确认 XM 服务正在运行。<br>连接恢复后，即可继续浏览你的档案。</p>
    <button id="offline-retry" type="button">重新连接</button>
    <p id="offline-status" role="status" aria-live="polite"></p>
    <small>归档内容仍保存在服务器，离线时无法读取。</small>
  </main>
</body>
</html>
